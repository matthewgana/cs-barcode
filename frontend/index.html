<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Department Attendance System</title>
  <meta name="description" content="University Computer Science Department Online Barcode Attendance Management System — 100 to 400 Level." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
  <link rel="stylesheet" href="/css/main.css?v=2" />
</head>
<body>
  <!-- App Shell (rendered by JS) -->
  <div id="app">
    <div id="app-loading" class="splash-loader">
      <div class="splash-content">
        <div class="splash-logo">🎓</div>
        <div class="splash-title">CS Attendance</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notification-container" aria-live="polite"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Camera Barcode Reader Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="/js/main.js?v=2"></script>
</body>
</html>
